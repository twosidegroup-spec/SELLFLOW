# ===========================================================================
# SellFlow :: Supabase project configuration
#
# Controls the Edge Function deploy, the local Supabase stack, and the auth
# redirect allow-list. It does NOT contain any secret: credentials are supplied
# per-environment and live in Supabase Vault.
#
# Link this to a real project once, with:
#   npx supabase login
#   npx supabase link --project-ref <your-project-ref>
#
# Then apply the schema and deploy the functions:
#   npx supabase db push
#   npx supabase functions deploy pathao-shipment
#   npx supabase functions deploy pathao-webhook
# ===========================================================================

# The existing SellFlow Supabase project. Linked with:
#   npx supabase link --project-ref ggnkvlnnfgvyxwlbjfqx
# Only the reference is recorded here. No credential of any kind is stored in
# this file -- API keys live in EAS environment variables and, for the courier,
# in Supabase Vault.
project_id = "ggnkvlnnfgvyxwlbjfqx"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Row Level Security is mandatory. `profiles` is deliberately NOT in the exposed
# list: it is reachable only through a table that has its own policies.
extra_tables = ["public.organizations", "public.organization_members", "public.stores"]

[db]
port = 54322
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Product images are the only intended upload target in V1.
file_size_limit = "50MiB"

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Password reset and email confirmation both deep-link back into the app.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Email confirmation is OFF, deliberately.
#
# This was `true` with a note saying it was "required before a shipped build can
# accept real users" -- i.e. a release step that was never performed. Both
# sign-up.tsx and this file documented the intended behaviour, and hosted did not
# match either.
#
# Why off, for SellFlow specifically:
#
#   * The intended flow is register -> authenticated session -> business setup
#     -> dashboard. A confirmation gate sits between the first two.
#   * The confirmation flow could not have worked even if enabled: hosted
#     site_url is http://localhost:3000 with no additional_redirect_urls, so a
#     confirmation link resolves to nothing on a handset. There is no
#     sellflow:// intent filter or confirmation-callback route in the app.
#     Implementing that properly is a feature, not a configuration change, and
#     it is not what this product is for.
#   * The account is not the security boundary. Every row a user can touch is
#     scoped by RLS to their own organisation, and `anon` holds no grant on any
#     application table (see migration 0024), so an unverified account can do
#     nothing to anyone.
#
# Compensating controls that remain in force:
#   * Supabase's built-in rate limits on /auth/v1/signup (email max_frequency is
#     1m0s) still apply, so signup cannot be scripted at volume.
#   * Password policy (min length, breached-password check) is unchanged.
#   * All data access is RLS-scoped; a spam account has no surface.
#
# If confirmation is ever wanted back, set this to true AND add the deep-link
# plumbing the flow needs, or the emails will dead-end at localhost.
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# ---------------------------------------------------------------------------
# Pathao credentials live here, NOT in the repository and NOT in the app.
#
# Create them once per environment with the service role key:
#   npx supabase secrets set \
#     PATHAO_CLIENT_ID=<...> \
#     PATHAO_CLIENT_SECRET=<...> \
#     PATHAO_WEBHOOK_SECRET=<...>
#
# Or, preferably, store them in Vault and point courier_connections.vault_secret_id
# at the row. read_vault_secret() is SECURITY DEFINER and granted to service_role
# only, so the anon key shipped in the app can never obtain these values.
# ---------------------------------------------------------------------------

[functions.pathao-shipment]
verify_jwt = true

# The webhook is called by Pathao's servers, which do not carry a Supabase JWT.
# It authenticates with the shared PATHAO_WEBHOOK_SECRET instead, so JWT
# verification is disabled here and the secret check is mandatory in code.
[functions.pathao-webhook]
verify_jwt = false
