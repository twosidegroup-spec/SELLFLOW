<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card</title>
    <style>
      /* Rendered at 1200x630 by og-render.mjs, then screenshotted. Kept in the
         repo so the social card can be regenerated after any design change
         instead of being a binary nobody can edit. Light, to match the page. */
      @import url('../src/fonts.css');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        background: #ffffff; color: #202124;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { display: flex; align-items: center; gap: 46px; padding: 0 60px; height: 100%; }
      .copy { flex: 1; min-width: 0; }
      .dev { font-size: 20px; font-weight: 500; color: #2563eb; margin-bottom: 4px; }
      .name {
        font-size: 84px; font-weight: 400; letter-spacing: -0.04em; line-height: 1;
        margin-bottom: 22px;
      }
      .sub { font-size: 27px; line-height: 1.36; color: #5f6368; max-width: 21ch; }
      .stats { display: flex; gap: 20px; margin-top: 34px; align-items: flex-start; }
      .stat b { display: block; font-size: 18px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; }
      .stat span { display: block; font-size: 13.5px; color: #5f6368; margin-top: 2px; }
      .stat + .stat { padding-left: 20px; border-left: 1px solid #e8eaed; }
      .install {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 220px; height: 58px; margin-top: 34px; border-radius: 8px;
        background: #2563eb; color: #fff; font-size: 18px; font-weight: 500;
        box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
      }
      .rail { display: flex; gap: 16px; flex: none; }
      .tile { width: 202px; }
      .art {
        height: 112px; border-radius: 14px 14px 0 0; padding: 16px;
        display: flex; align-items: flex-end;
      }
      .art p { font-size: 18px; font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; max-width: 11ch; }
      .tint-a { background: linear-gradient(160deg, #3b82f6, #1d4ed8); color: #fff; }
      .tint-b { background: linear-gradient(160deg, #f3e7d6, #e8d6bd); color: #4a3f2f; }
      .tint-c { background: linear-gradient(160deg, #d8f0e4, #bfe4d2); color: #1d4d38; }
      .shot {
        border-radius: 0 0 14px 14px; overflow: hidden;
        border: 1px solid #e8eaed; border-top: 0; background: #0b1120;
      }
      .shot img { display: block; width: 100%; aspect-ratio: 390 / 560; object-fit: cover; object-position: top; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="copy">
        <p class="dev">SellFlow</p>
        <p class="name">SellFlow</p>
        <p class="sub">From order to delivered — all in one place.</p>
        <div class="stats">
          <div class="stat"><b>No ratings yet</b><span>Be the first to review</span></div>
          <div class="stat"><b>Android</b><span>Direct APK download</span></div>
          <div class="stat"><b>~110 MB</b><span>v1.0.0</span></div>
        </div>
        <div class="install">Install</div>
      </div>
      <div class="rail">
        <div class="tile">
          <div class="art tint-a"><p>Every order, one queue</p></div>
          <div class="shot"><img src="../public/assets/img/screens/orders.png" alt="" /></div>
        </div>
        <div class="tile">
          <div class="art tint-b"><p>Stock you can trust</p></div>
          <div class="shot"><img src="../public/assets/img/screens/product-detail.png" alt="" /></div>
        </div>
        <div class="tile">
          <div class="art tint-c"><p>Revenue isn't profit</p></div>
          <div class="shot"><img src="../public/assets/img/screens/finance.png" alt="" /></div>
        </div>
      </div>
    </div>
  </body>
</html>
